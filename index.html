<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
        <title>Rekap Nilai</title>
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script defer src="script.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
    </head>
    <body>
        <div class="container mt-5">
            <h2 class="text-center">Rekap Nilai Siswa</h2>
            <!-- FORM -->
            <div class="card p-3 mt-3" id="form">
                <input id="nama" class="form-control mb-2" placeholder="Nama">
                <div class="row">
                    <div class="col"><input id="uh1" class="form-control" placeholder="UH1"></div>
                    <div class="col"><input id="uh2" class="form-control" placeholder="UH2"></div>
                    <div class="col"><input id="uh3" class="form-control" placeholder="UH3"></div>
                </div>
                <div class="row mt-2">
                    <div class="col"><input id="uts" class="form-control" placeholder="UTS"></div>
                    <div class="col"><input id="uas" class="form-control" placeholder="UAS"></div>
                </div>
                <button type="button" id="btnHitung" class="btn btn-primary mt-3">
                    Hitung
                </button>
            </div>
            <!-- HASIL -->
            <div class="card p-3 mt-3" id="hasil">
                <p id="data">Belum ada data</p>
            </div>
            <!-- TABEL -->
            <table class="table mt-3" id="table">
                <thead class="table-dark">
                    <tr>
                        <th>Nama</th>
                        <th>Rata-rata</th>
                        <th>Grade</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelData"></tbody>
            </table>
        </div>
    </body>
</html>
